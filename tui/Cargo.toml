[package]
name = "aricma-lazytodo"
version.workspace = true
edition.workspace = true
description = "The terminal interface: read and edit todo lines in markdown files"

[[bin]]
name = "aricma-lazytodo"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
unicode-width = "0.2"
aricma-todo-lib = { path = "../lib" }

[dev-dependencies]
testkit = { path = "../../testkit" }
datatest-stable = "0.3"
insta = "1"
portable-pty = "0.9"
tempfile = "3"
vt100 = "0.18"

[[test]]
name = "cases"
path = "tests/cases.rs"
harness = false
