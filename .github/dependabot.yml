version: 2

# Weekly, and two pull requests rather than one per crate: patches and minors ride
# together because a test run is the whole of the review, and a major opens its own
# so it can be read on its own.
#
# What this does not cover: `rust-toolchain.toml` (no ecosystem for it) and the one
# git dependency in `lib/`, which is pinned to a rev and moved by hand.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
      major:
        update-types:
          - major
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
