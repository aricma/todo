name: TUI quality

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check. Empty means the commit that called this.
        type: string
        required: false

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install the pinned toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --component rustfmt,clippy
          echo "toolchain $channel with rustfmt and clippy is ready"

      - uses: Swatinem/rust-cache@v2

      - name: Format
        shell: bash
        run: |
          cargo fmt --check
          echo "format: every file is already formatted"

      - name: Lint
        shell: bash
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          echo "lint: no warnings, with pedantic denied"

      - name: Test
        shell: bash
        run: |
          cargo test --workspace --all-targets
          echo "test: every suite passed"

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --package lazytodo
          echo "build: target/release/lazytodo, from the committed lockfile"

      - name: Use
        shell: bash
        run: |
          bin="target/release/lazytodo"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="$bin.exe"
          fi
          "$bin" --version
          "$bin" --help >/dev/null
          echo "use: it starts and answers --help"
