name: Release

# Run by hand, one package at a time, and it always takes a tag: the pipeline
# releases a version, it never chooses one.
#
#   lib  aricma-todo-lib   a crate; no binary, so no archive
#   cli  aricma-todo-cli   the `aricma-todo` binary
#   tui  lazytodo          the `lazytodo` binary
#
# Every package carries its own version in its own Cargo.toml, its own CHANGELOG.md
# and its own tag `<package>-v<version>`, so one can move without the others.
#
#   the tag names a commit   → that commit is built and released
#   the tag names no commit  → the tip of the default branch is built, and the tag
#                              is created on it
#   no tag, or the wrong one → the run stops before anything is built
#
# Nothing is written until a person approves the `release` environment: the tag, the
# release and every asset appear only after the review, so a run that looks wrong is
# abandoned without a version to retract. `dryrun` builds and packs without asking
# for that approval and without writing anything.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package's release this is
        type: choice
        options:
          - tui
          - cli
          - lib
        required: true
      tag:
        description: The package's tag, for example tui-v0.1.0. No discovery, no default.
        type: string
        required: true
      dryrun:
        description: Build and validate everything, publish nothing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Which commit is this version? A tag that exists answers it; one that does not
  # means the default branch's tip, and the commit is pinned here so the review and
  # the release are about the same one even if the branch moves during the wait.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.pick.outputs.version }}
      tagged: ${{ steps.pick.outputs.tagged }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve the tag and its commit
        id: pick
        env:
          GIVEN: ${{ inputs.tag }}
          PACKAGE: ${{ inputs.package }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag=$GIVEN
          case "$tag" in
            "") echo "no tag given: this pipeline releases a version, it does not choose one"
                exit 1 ;;
          esac
          # the tag names the package, so a run cannot release `tui-v0.1.0` as `cli`
          prefix="$PACKAGE-v"
          version=${tag#"$prefix"}
          if [ "$version" = "$tag" ]; then
            echo "tag $tag does not belong to package $PACKAGE, which tags $prefix<version>"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a <version> after $prefix: $tag"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            sha=$(git rev-parse "refs/tags/$tag^{commit}")
            tagged=true
            echo "$tag names $sha"
          else
            sha=$(git rev-parse HEAD)
            tagged=false
            echo "$tag names no commit: releasing $sha, the tip of $BRANCH"
          fi
          # the archive carries the tag in its name, so a tag that disagrees with the
          # package's own version would publish a binary whose --version says otherwise
          declared=$(git show "$sha:$PACKAGE/Cargo.toml" \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          if [ "$declared" != "$version" ]; then
            echo "tag $tag is not the version $declared in $PACKAGE/Cargo.toml at $sha"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "version=$version"
            echo "tagged=$tagged"
          } >> "$GITHUB_OUTPUT"

      # The notes come from the package's own changelog, and a version without a
      # section fails the run: a release with no changelog is the thing this job
      # exists to prevent. Written before the approval so it can be read while
      # deciding.
      - name: Name the changes
        env:
          PACKAGE: ${{ inputs.package }}
          SHA: ${{ steps.pick.outputs.sha }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          notes=$(git show "$SHA:$PACKAGE/CHANGELOG.md" | awk -v wanted="## $VERSION" '
            $0 == wanted { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ')
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "no \`## $VERSION\` section in $PACKAGE/CHANGELOG.md at $SHA"
            exit 1
          fi
          printf '%s\n' "$notes" > notes.md
          echo "$PACKAGE $VERSION: $(grep -c '^- ' notes.md) entries"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: notes.md
          if-no-files-found: error

  # The approval. Its steps are the first thing in the pipeline that writes, so the
  # pause happens before a tag exists, not after.
  publish:
    needs: resolve
    if: ${{ !inputs.dryrun }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      # after the checkout, which cleans untracked files out of the workspace
      - uses: actions/download-artifact@v8
        with:
          name: changelog

      - name: Tag the commit, when the tag was new
        if: ${{ needs.resolve.outputs.tagged == 'false' }}
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          # an annotated tag needs an identity, and the runner has none configured
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"

      - name: Open the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          # a re-run refreshes the notes rather than leaving the first ones there
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi

  # A crate has nothing to download: its release is the tag and the changelog.
  binaries:
    needs: [resolve, publish]
    if: ${{ !failure() && !cancelled() && inputs.package != 'lib' }}
    env:
      CRATE: ${{ inputs.package == 'cli' && 'aricma-todo-cli' || 'lazytodo' }}
      BIN: ${{ inputs.package == 'cli' && 'aricma-todo' || 'lazytodo' }}
    strategy:
      fail-fast: false
      matrix:
        # Both macOS architectures: the runner is arm64, and the Intel binary is a
        # cross-build rather than a second machine.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      # the commit that was reviewed, not the branch it came from
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # A no-op where the target is the host, a download for the other macOS one.
      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --package ${{ env.CRATE }} --target ${{ matrix.target }}

      # One format on every platform: `tar` is on all three runners, and Windows 10
      # opens a `.tar.gz` without extra software. The archive is named after the tag,
      # so `install.sh` can find it without a table of product names.
      - name: Pack
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          name="${TAG}-${{ matrix.target }}"
          exe=""
          case "${{ matrix.target }}" in *windows*) exe=".exe" ;; esac
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ env.BIN }}$exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: Upload
        if: ${{ !inputs.dryrun }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
