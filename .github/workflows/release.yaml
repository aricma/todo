name: Release

# By hand, one `tui` version at a time. A version whose tag already exists is released
# from that commit; one whose tag does not is tagged on the default branch's tip.
# Everything is written only after the `release` environment is approved, and `dryrun`
# writes nothing at all.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The tui version to release, for example 0.1.0. No discovery.
        type: string
        required: true
      dryrun:
        description: Build and validate everything, publish nothing
        type: boolean
        default: true

permissions:
  contents: write

env:
  PACKAGE: tui

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
      tagged: ${{ steps.commit.outputs.tagged }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Turn the version into a tag
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "no version given: nothing to release"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a version: $VERSION, expected 0.1.0"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$PACKAGE-v$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "asked for $PACKAGE $VERSION: the tag to release, or to create, is $PACKAGE-v$VERSION"

      - name: Find the commit
        id: commit
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            sha=$(git rev-parse "refs/tags/$TAG^{commit}")
            tagged=true
            echo "tag $TAG already exists and points at $sha: releasing that commit, not the branch"
          else
            sha=$(git rev-parse HEAD)
            tagged=false
            echo "no tag $TAG exists yet. This release will create it on $sha, the tip of $BRANCH,"
            echo "and $sha is the commit that gets built and released."
          fi
          {
            echo "sha=$sha"
            echo "tagged=$tagged"
          } >> "$GITHUB_OUTPUT"

      - name: Check the version in the manifest
        shell: bash
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          declared=$(git show "$SHA:$PACKAGE/Cargo.toml" \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          if [ "$declared" != "$VERSION" ]; then
            echo "$SHA is $declared in $PACKAGE/Cargo.toml, not $VERSION"
            exit 1
          fi
          echo "$PACKAGE/Cargo.toml at $SHA declares $declared, which is the version being released"

      - name: Check the version in the changelog
        shell: bash
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          latest=$(git show "$SHA:$PACKAGE/CHANGELOG.md" | sed -n 's/^## //p' | head -1)
          if [ "$latest" != "$VERSION" ]; then
            echo "the newest section in $PACKAGE/CHANGELOG.md at $SHA is ${latest:-none}, not $VERSION"
            exit 1
          fi
          echo "$VERSION is the newest section in $PACKAGE/CHANGELOG.md at $SHA, so the notes describe it"

      - name: Name the changes
        shell: bash
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=$(git show "$SHA:$PACKAGE/CHANGELOG.md" | awk -v wanted="## $VERSION" '
            $0 == wanted { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ')
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "no text under \`## $VERSION\` in $PACKAGE/CHANGELOG.md at $SHA"
            exit 1
          fi
          printf '%s\n' "$notes" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "notes: $(wc -l < notes.md | tr -d ' ') lines taken from $PACKAGE/CHANGELOG.md"

      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: notes.md
          if-no-files-found: error

  quality:
    needs: prepare
    uses: ./.github/workflows/tui-quality.yaml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  binaries:
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Add the target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          echo "$TARGET is part of the pinned toolchain"

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --locked --package lazytodo --target "$TARGET"
          echo "built target/$TARGET/release for $TARGET, from the committed lockfile"

      - name: Smoke test in a scratch image
        if: ${{ contains(matrix.target, 'musl') }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p /tmp/nothing
          cp "target/$TARGET/release/lazytodo" /tmp/nothing/
          printf 'FROM scratch\nCOPY lazytodo /lazytodo\n' > /tmp/nothing/Dockerfile
          echo "An image from scratch holds nothing but this file, so this is its whole Dockerfile:"
          cat /tmp/nothing/Dockerfile
          docker build -q -t lazytodo-nothing /tmp/nothing
          echo "Running the binary inside it: with no libc, no shell and no files, a missing"
          echo "dependency has nowhere to hide and this run fails:"
          docker run --rm lazytodo-nothing /lazytodo --version
          echo "It answered with its version, so the $TARGET binary needs nothing from the system it lands on."

      - name: Pack
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="${TAG}-${TARGET}"
          exe=""
          if [[ "$TARGET" == *windows* ]]; then
            exe=".exe"
          fi
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/lazytodo$exe" "dist/$name/"
          cp "$PACKAGE/README.md" LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          echo "packed dist/$name.tar.gz, $(wc -c < "dist/$name.tar.gz" | tr -d ' ') bytes"

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # The only job that writes, so one approval covers the tag, the release and the assets.
  publish:
    needs: [prepare, quality, binaries]
    if: ${{ !inputs.dryrun }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      # After the checkout, which cleans untracked files out of the workspace.
      - uses: actions/download-artifact@v8
        with:
          name: changelog

      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: One checksums file for every archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd dist
          file="lazytodo_${VERSION}_checksums.txt"
          {
            echo "# sha256 of every archive in the $VERSION release, one line each."
            echo "# Check the ones you downloaded, in the folder that holds them:"
            echo "#   sha256sum -c $file --ignore-missing"
            echo "# On macOS the command is shasum -a 256 -c, with the same arguments."
          } > "$file"
          sha256sum ./*.tar.gz | sed 's|  \./|  |' >> "$file"
          echo "wrote $file, and this is all of it:"
          cat "$file"

      - name: Tag the commit, when the tag was new
        if: ${{ needs.prepare.outputs.tagged == 'false' }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "created tag $TAG on $SHA and pushed it"

      - name: Release the notes and the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -- dist/*
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
            echo "updated the existing release $TAG with $# files"
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md dist/*
            echo "opened $TAG with its notes and $# files"
          fi
