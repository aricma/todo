name: Release

# Built from a tag, so what a person downloads is a commit that went through CI on
# `main`. Nothing here runs on a branch push.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # One job opens the release before the others upload into it: four jobs calling
  # `gh release create` at the same moment would race, and only one can win.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The archive carries the tag in its name, so a tag that disagrees with
      # Cargo.toml would publish a binary whose `--version` says something else.
      - name: The tag is the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME is not the version v$version in Cargo.toml"
            exit 1
          fi

      - name: Open the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  binaries:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # Both macOS architectures: the runner is arm64, and the Intel binary is a
        # cross-build rather than a second machine.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # A no-op where the target is the host, a download for the other macOS one.
      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --package aricma-todo-cli --package lazytodo --target ${{ matrix.target }}

      # One format on every platform: `tar` is on all three runners, and Windows 10
      # opens a `.tar.gz` without extra software.
      - name: Pack
        shell: bash
        run: |
          name="lazytodo-$GITHUB_REF_NAME-${{ matrix.target }}"
          exe=""
          case "${{ matrix.target }}" in *windows*) exe=".exe" ;; esac
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/lazytodo$exe" "dist/$name/"
          cp "target/${{ matrix.target }}/release/aricma-todo$exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber
