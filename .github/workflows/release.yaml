name: Release

# Run by hand, never on a tag push: a person decides what goes out, and the run
# starts by proving there is exactly one tag to release and that it is a version.
#
# `dryrun` defaults to true, so pressing the button builds and packs all four
# targets and writes nothing to the release. Turn it off to publish.
on:
  workflow_dispatch:
    inputs:
      dryrun:
        description: Build and validate everything, publish nothing
        type: boolean
        default: true
      tag:
        description: The tag to release. Leave empty while the repository has only one.
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # The gate: which tag, whether it is the only one, and whether it is a version.
  # It also opens the release, so the four builds below never race to create it.
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      # every tag, because the default depth fetches none
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick the one tag
        id: pick
        env:
          GIVEN: ${{ inputs.tag }}
        run: |
          tags=$(git tag --list)
          if [ -n "$GIVEN" ]; then
            tag=$GIVEN
            if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              echo "no such tag: $tag"
              exit 1
            fi
          else
            count=$(printf '%s\n' "$tags" | grep -c . || true)
            if [ "$count" -ne 1 ]; then
              echo "expected exactly one tag, found $count: ${tags:-none}"
              echo "name the tag in the input when there is more than one"
              exit 1
            fi
            tag=$tags
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a v<semver> tag: $tag"
            exit 1
          fi
          # the archive carries the tag in its name, so a tag that disagrees with
          # the crate version would publish a binary whose --version says otherwise
          version=$(git show "$tag:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          if [ "v$version" != "$tag" ]; then
            echo "tag $tag is not the version v$version in Cargo.toml"
            exit 1
          fi
          echo "releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Open the release
        if: ${{ !inputs.dryrun }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes

  binaries:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # Both macOS architectures: the runner is arm64, and the Intel binary is a
        # cross-build rather than a second machine.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      # the tag, not the branch the button was pressed on
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.tag }}

      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # A no-op where the target is the host, a download for the other macOS one.
      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --package aricma-todo-cli --package lazytodo --target ${{ matrix.target }}

      # One format on every platform: `tar` is on all three runners, and Windows 10
      # opens a `.tar.gz` without extra software.
      - name: Pack
        shell: bash
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          name="lazytodo-${TAG}-${{ matrix.target }}"
          exe=""
          case "${{ matrix.target }}" in *windows*) exe=".exe" ;; esac
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/lazytodo$exe" "dist/$name/"
          cp "target/${{ matrix.target }}/release/aricma-todo$exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: Upload
        if: ${{ !inputs.dryrun }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
