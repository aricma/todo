name: Release

# By hand, one `tui` tag at a time. A tag that exists names its commit; a tag that
# does not is created on the default branch's tip. Everything is written only after
# the `release` environment is approved, and `dryrun` writes nothing at all.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tui tag, for example tui-v0.1.0. No discovery, no default.
        type: string
        required: true
      dryrun:
        description: Build and validate everything, publish nothing
        type: boolean
        default: true

permissions:
  contents: write

env:
  PACKAGE: tui

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.pick.outputs.version }}
      tagged: ${{ steps.pick.outputs.tagged }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve the tag and its commit
        id: pick
        env:
          GIVEN: ${{ inputs.tag }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag=$GIVEN
          if [ -z "$tag" ]; then
            echo "no tag given: cannot tell whether to release an existing tag or to create a new one"
            exit 1
          fi
          prefix="$PACKAGE-v"
          version=${tag#"$prefix"}
          if [ "$version" = "$tag" ]; then
            case "$tag" in
              cli-*|lib-*)
                echo "only $PACKAGE is released for now: $tag belongs to another package"
                exit 1 ;;
            esac
            echo "tag $tag is not a $PACKAGE tag: expected ${prefix}<version>"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a <version> after $prefix: $tag"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            sha=$(git rev-parse "refs/tags/$tag^{commit}")
            tagged=true
            echo "$tag names $sha"
          else
            sha=$(git rev-parse HEAD)
            tagged=false
            echo "$tag names no commit: releasing $sha, the tip of $BRANCH"
          fi
          declared=$(git show "$sha:$PACKAGE/Cargo.toml" \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          if [ "$declared" != "$version" ]; then
            echo "tag $tag is not the version $declared in $PACKAGE/Cargo.toml at $sha"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "version=$version"
            echo "tagged=$tagged"
          } >> "$GITHUB_OUTPUT"

      - name: Name the changes
        env:
          SHA: ${{ steps.pick.outputs.sha }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          notes=$(git show "$SHA:$PACKAGE/CHANGELOG.md" | awk -v wanted="## $VERSION" '
            $0 == wanted { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ')
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "no \`## $VERSION\` section in $PACKAGE/CHANGELOG.md at $SHA"
            exit 1
          fi
          printf '%s\n' "$notes" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: notes.md
          if-no-files-found: error

  ci:
    needs: resolve
    uses: ./.github/workflows/tui-ci.yaml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # Its own job so the approval holds everything that writes, and only that.
  publish:
    needs: [resolve, ci]
    if: ${{ !inputs.dryrun }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      # After the checkout, which cleans untracked files out of the workspace.
      - uses: actions/download-artifact@v8
        with:
          name: changelog

      - name: Tag the commit, when the tag was new
        if: ${{ needs.resolve.outputs.tagged == 'false' }}
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"

      - name: Open the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi

  binaries:
    needs: [resolve, ci, publish]
    # A dry run skips `publish`, and a skip is not a failure.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --locked --package lazytodo --target ${{ matrix.target }}

      - name: Pack
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          name="${TAG}-${{ matrix.target }}"
          exe=""
          case "${{ matrix.target }}" in *windows*) exe=".exe" ;; esac
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/lazytodo$exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: Upload
        if: ${{ !inputs.dryrun }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
