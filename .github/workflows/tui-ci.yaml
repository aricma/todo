name: TUI CI

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check. Empty means the commit that called this.
        type: string
        required: false

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install the pinned toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Build
        run: cargo build --release --locked --package lazytodo

      - name: Use
        shell: bash
        run: |
          bin="target/release/lazytodo"
          case "$RUNNER_OS" in Windows) bin="$bin.exe" ;; esac
          "$bin" --version
          "$bin" --help >/dev/null
