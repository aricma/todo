[workspace]
# One project, three native surfaces: the markdown rules in `lib/` and the two
# clients over them — `aricma-todo` (cli) and `aricma-lazytodo` (tui).
#
# `web/` is deliberately NOT a member. It builds for wasm32 only and carries its
# own [workspace] table, so a native `cargo build` here never tries to compile it
# for the host (same arrangement as aricma-moth/ui).
members = ["lib", "cli", "tui"]
exclude = ["web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# natural naming trips this
module_name_repetitions = "allow"
# pub API docs noise for an internal tool's lib
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
