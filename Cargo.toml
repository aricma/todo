[workspace]
# One project, four parts: the markdown rules in `lib/`, the two clients over
# them — `aricma-todo` (cli) and `lazytodo` (tui) — and the `testkit` their
# suites share.
members = ["lib", "cli", "tui", "testkit"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# natural naming trips this
module_name_repetitions = "allow"
# pub API docs noise for an internal tool's lib
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
